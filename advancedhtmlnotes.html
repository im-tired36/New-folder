<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Advanced HTML Notes</title>
        <meta charset="UTF-8">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&display=swap" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Jacquard+24&family=MedievalSharp&display=swap" rel="stylesheet">
        <style>
            /* Cascading Style Sheets
            1. Selector
            2. Declaration
                a.Property
                b.Value
                */
            body{
                color:rgb(50, 72, 100);
                background-color:rgb(82, 126, 151);
                font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
            }
            ul{ 
                background-color:rgba(112, 149, 219, 0.651);
                border-radius:4px;
                width:100px;
                height:80px;
                border:solid 2px rgb(107, 137, 238)
                /*can use % px em and vw and vh used to adust size based on the size of the screen*/
            }
            h1{
                color:paleturquoise;
                text-decoration: underline;
                text-align: center;
                font-family: "Jacquard 24", system-ui;
                font-weight: 500;
                font-style: normal;
            }
            #even{
                color:aliceblue;
                font-weight: 100px;
            }
            .numbered{
                font-size:20px;
                font-family: "MedievalSharp", cursive;
                font-weight: 400;
                font-style: normal;;
            }
            .important{
                font:bold;
            }
            #winter{
                width:50%;
            }

        </style>

    </head>
    <body>
        <h1>Advanced HTML Notes</h1>
        <h3>Lists:</h3>
        <ol type="i"
        class="numbered">
            <li>This is the first thing</li>
            <li id="even">This is the second</li>
            <li>This comes in third</li>
        </ol>
        <ul>
            <li><a href="https://www.pickpik.com/orchard-apple-apples-fruit-green-nature-10657" target="_blank">Apple</a></li>
            <li id="even">Banana</li>
            <li>Orange</li>
            <li id="even" class="important">Kiwi</li>
        </ul style="square">
        <dl>
            <dt>Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>hanukah</dd>
            <dd>New Years</dd>
        </dl>

        <h3>Attributes:</h3>
        <a href="https://www.alltrails.com/trail/us/utah/mt-timpanogos-timpooneke-trail" target="_blank"><img src="https://globalsummitguide.com/wp-content/uploads/2026/07/AdobeStock_1146206325-scaled.jpeg" alt="Mount Timp" width="200px"></a>
        <div>
        <img src="MT_Timp.jpg" alt="Sunset on Timp" width="200px">
        <p>Image from <a href="https://commons.wikimedia.org/wiki/File:Mount_Timpanogos_at_sunset.jpg" target="_blank" id="winter">Wikimedia Commons</a></p>
        </div>
    </body>
</html>
