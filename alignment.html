<!DOCTYPE html>
<html> 
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin: 8px;
                margin-left: 50px;
            }
            #box, #box2{
                width: 75px;
                height: 75px;
                background-color: rgb(82, 126, 165);
                color: white;
                text-align: center;
                margin: 0 auto;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wapper{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
               
            }
            #macaw{
                width: 150px;
            }
            #span{
                text-decoration: underline;
            }
        </style>
    </head>
    <body>
       <h1>Alignment Notes</h1>
       <img src="https://img.magnific.com/free-photo/closeup-scarlet-macaw-from-side-view-scarlet-macaw-closeup-head_488145-3540.jpg?semt=ais_hybrid&w=740&q=80" alt = id="macaw" onmouseoever="changeImage()">
       <div id="box-wrapper">
        <div id="box" onmouseover="disappear() "onmouseout="appear">
            <p>Box 1</p>
        </div>
        <div id="boxTwo">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
       </div>
       <div id="flex-wrapper">
        <div id="box">
            <p>Box 1</p>
        </div>
        <p>This is a paragraph to show how you can make changes to just a part of a sentence, <span id="span">or a paragraph,</span> without putting a new pragraph inside of the paragraph</p>
        <div id="box">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
       </div>
       <input type="color" id="colorPicker">
       <button onClick="color()">Click MEE neow</button>
       <button id="showMore" onClick="show">Show more</button>
       <script>
        //makes the webpage interactive
        let images = ["https://img.magnific.com/free-photo/closeup-shot-beautiful-butterfly-with-interesting-textures-orange-petaled-flower_181624-7640.jpg?semt=ais_hybrid&w=740&q=80", "https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg?w=600&quality=80", "https://media.springernature.com/lw703/springer-static/image/art%3A10.1038%2F528452a/MediaObjects/41586_2015_Article_BF528452a_Figg_HTML.jpg", "https://img.magnific.com/free-photo/closeup-scarlet-macaw-from-side-view-scarlet-macaw-closeup-head_488145-3540.jpg?semt=ais_hybrid&w=740&q=80"]
        let current= 0 
        function changeImage(){
            current+=1
            document.getElementById("macaw").src = images[current]
            if (current > 3){
                current = 0
            }
        }
        function color(){
            let newColor = document.getElementById("colorPicker").value
            document.getElementById("box").style.backgroundColor = newColor
            //document gets the html and then getElementById  searches the html 
         }
        function disappear(){
            document.getElementById("boxTwo").style.display = "none"
        }
        function appear(){
            document.getElementById("boxTwo").style.display = "block"
        }
        function show(){
            let element = document.getElementById("flex-wrapper")
            if(element.style.display == "flex"){
                element.style.display = "none"
            }else{
                element.style.display = "flex"
            }
        }

       </script>
    </body>
</html>
