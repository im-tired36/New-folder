<!DOCTYPE html>
<html> 
    <head>
        <title>Alignment</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin: 8px;
                margin-left: 50px;
            }
            #box, #box2{
                width: 75px;
                height: 75px;
                background-color: rgb(82, 126, 165);
                color: white;
                text-align: center;
                margin: 0 auto;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 200px 1fr;
                gap: 5px;
            }
            #flex-wapper{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
               
            }
        </style>
    </head>
    <body>
       <h1>Alignment Notes</h1>
       <div id="box-wrapper">
        <div id="box" onmouseover="disappear() "onmouseout="appear">
            <p>Box 1</p>
        </div>
        <div id="boxTwo">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
       </div>
       <div id="flex-wrapper">
        <div id="box">
            <p>Box 1</p>
        </div>
        <div id="box">
            <p>Box 2</p>
        </div>
        <div id="box">
            <p>Box 3</p>
        </div>
        <div id="box">
            <p>Box 4</p>
        </div>
       </div>
       <input type="color" id="colorPicker">
       <button onClick="color()">Click MEE neow</button>
       <button id="showMore" onClick="show">Show more</button>
       <script>
        //makes the webpage interactive
         function color(){
            let newColor = document.getElementById("colorPicker").value
            document.getElementById("box").style.backgroundColor = newColor
            //document gets the html and then getElementById  searches the html 
         }
        function disappear(){
            document.getElementById("boxTwo").style.display = "none"
        }
        function appear(){
            document.getElementById("boxTwo").style.display = "block"
        }
        function show(){
            let element = document.getElementById("flex-wrapper")
            if(element.style.display == "flex"){
                element.style.display = "none"
            }else{
                element.style.display = "flex"
            }
        }

       </script>
    </body>
</html>
