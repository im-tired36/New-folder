<!DOCTYPE html>
<html> <!--This is a comment tag-->
    <head>
        <title>CSS Styling with Color</title>
        <meta charset="UTF-8">
        <style>
            #complimentary{ 
                background-color:rgba(112, 149, 219, 0.651);
                border-radius:4px;
                width:100px;
                height:80px;
                border:solid 4px rgba(143, 106, 36, 0.651);
                
            }
            #analogous{ 
                background-color:rgba(179, 93, 93, 0.747);
                border-radius:4px;
                width:100px;
                height:80px;
                border:solid 4px rgba(179, 93, 136, 0.747);
                color:rgba(255, 184, 184, 0.747);
                
            }
            #triadic{ 
                background-color:rgba(88, 165, 82, 0.87);
                border-radius:4px;
                width:100px;
                height:80px;
                border:solid 4px rgba(82, 88, 165, 0.87);
                color:rgba(165, 82, 88, 0.87);
            }
            body{
                background-color: rgb(196, 196, 196);
            }
        </style>
    </head>
    <body>
        <h1>Color Theory</h1>
        <div id="complimentary">
            <p>complimentary</p>
            
        </div>
        <div id="analogous">
            <p>analogous</p>
        </div>
        <div id="triadic">
            <p>triadic</p>
        </div>
        
    </body>
</html>
